site_name: 'DENA Interop - Documentación para Administraciones'
site_description: 'Documentación técnica y funcional del proyecto DENA para administraciones públicas integradoras'
site_url: 'https://DENA-Euskadi.github.io/dena-common-docs'

theme:
  name: material
  language: es
  custom_dir: docs/overrides
  palette:
    scheme: default
    primary: dena
    accent: teal
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/swap-horizontal-bold
    repo: material/github
    admonition:
      note: material/pencil
      tip: material/lightbulb
      info: material/information
      warning: material/alert
      danger: material/alert-octagon
      success: material/check-circle
      failure: material/close-circle
      question: material/help-circle
      example: material/test-tube
      abstract: material/clipboard-text
  logo: adjuntos/logos/Dena_RGB_Calado_H.png
  favicon: adjuntos/logos/Dena_RGB_Calado_H.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - Inicio: index.md
  - Primeros Pasos:
      - Checklist de Onboarding: guia-inicio/onboarding.md
      - Instalación: guia-inicio/instalacion.md
      - Pruebas de Conectividad: guia-inicio/probar-comunicaciones.md
      - Configuración Mock: guia-inicio/mock-expedientes.md
  - Autenticación:
      - Visión General: autenticacion/index.md
      - DENA Llama a Tu Sistema: autenticacion/core-dena-administracion/index.md
      - Tu Sistema Llama a DENA: autenticacion/administracion-core-dena/index.md
  - Semántica:
      - Visión General: semantica/index.md
      - Tipos de Datos Disponibles:
          - Campos Comunes: semantica/data-retrieve/data/campos-comunes.md
          - Cita: semantica/data-retrieve/data/cita.md
          - Expediente: semantica/data-retrieve/data/expediente.md
          - Notificación: semantica/data-retrieve/data/notificacion.md
          - Pago: semantica/data-retrieve/data/pago.md
          - Persona: semantica/data-retrieve/data/persona.md
          - Registro Oficial: semantica/data-retrieve/data/registro-oficial.md
          - Servicio Administrativo: semantica/data-retrieve/data/servicio-administrativo.md
          - Unidad Orgánica: semantica/data-retrieve/data/unidad-organica.md
      - Modelos Base:
          - Data Type Ref: semantica/semantica-base/modelo/data-type-ref.md
          - Language Texts: semantica/semantica-base/modelo/language-texts.md
          - Org Admin Ref: semantica/semantica-base/modelo/org-admin-ref.md
          - Person Ref: semantica/semantica-base/modelo/person-ref.md
  - Operativas: operativas/index.md
  - Herramientas:
      - DevTools Web: devtools/index.md
      - Ejemplos de Código: ejemplos-codigo/index.md
      - Recursos Postman: adjuntos/index.md
  - Ayuda y Referencia:
      - Preguntas Frecuentes: referencia/faq.md
      - Resolver Problemas: referencia/troubleshooting.md
      - Glosario de Términos: referencia/glosario.md
      - Contacto y Soporte: referencia/contacto.md

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: es
  - macros:
      include_yaml:
        - ./mkdocs-vars.yaml
  - tags

extra_css:
  - stylesheets/01-variables.css
  - stylesheets/02-material-overrides.css
  - stylesheets/03-header-navigation.css
  - stylesheets/04-ui-elements.css
  - stylesheets/05-content-elements.css
  - stylesheets/06-mermaid-diagrams.css

extra:
  generator: false
  social:
    - icon: material/github
      link: https://github.com/DENA-Euskadi
      name: DENA en GitHub
    - icon: material/email
      link: mailto:admin-digital-data-dena@ejie.eus
      name: Contacto Soporte DENA
  tags:
    Data-Retrieve: data-retrieve
    Metadata-Sync: metadata-sync
    Person-Sync: person-sync
    Autenticación: autenticacion
    Guía: guia
    Referencia: referencia
  support:
    email: admin-digital-data-dena@ejie.eus

extra_css:
  - stylesheets/extra.css
