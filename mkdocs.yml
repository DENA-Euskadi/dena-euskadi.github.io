site_name: 'DENA Interop - Documentación para Administraciones'
site_description: 'Documentación técnica y funcional del proyecto DENA para administraciones públicas integradoras'
site_url: 'https://DENA-Euskadi.github.io/'

theme:
  name: material
  language: es
  custom_dir: docs/overrides
  palette:
    scheme: default
    primary: dena
    accent: teal
  font: false
  icon:
    logo: material/swap-horizontal-bold
    repo: material/github
    admonition:
      note: material/pencil
      tip: material/lightbulb
      info: material/information
      warning: material/alert
      danger: material/alert-octagon
      success: material/check-circle
      failure: material/close-circle
      question: material/help-circle
      example: material/test-tube
      abstract: material/clipboard-text
  logo: adjuntos/logos/Dena_RGB_NegativoColor_H.png
  favicon: adjuntos/logos/Dena_RGB_NegativoColor_H.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - Inicio: index.md
  - Arquitectura:
      - Visión General: arquitectura/index.md
      - Arquitectura de Servicios: arquitectura/arquitectura-servicios.md
      - Configuración: arquitectura/configuracion.md
      - Modelo de Datos Base: arquitectura/tipos-dato-base.md
      - Diagramas: arquitectura/diagramas.md
      - Otra Documentación: arquitectura/otra-documentacion.md
  - Seguridad y Autenticación:
      - Visión General: seguridad/index.md
      - Tu Sistema Llama a DENA: autenticacion/administracion-core-dena/index.md
      - DENA Llama a Tu Sistema: autenticacion/core-dena-administracion/index.md
  - Operativas:
      - Visión General: operativas/index.md
      - Data-Retrieve (Servir Datos): operativas/data-retrieve.md
      - Metadata-Sync (Notificar Cambios): operativas/metadata-sync.md
      - Person-Sync (Sincronizar Personas): operativas/person-sync.md
  - Semántica:
      - Visión General: semantica/index.md
      - Data-Retrieve:
          - Visión General: semantica/data-retrieve/index.md
          - Endpoint: semantica/data-retrieve/endpoint-data-retrieve.md
          - Guía de Implementación: semantica/data-retrieve/guia-implementacion.md
          - Validaciones: semantica/data-retrieve/validaciones.md
          - Errores y Troubleshooting: semantica/data-retrieve/errores-troubleshooting.md
          - Snippets de Código: semantica/data-retrieve/snippets-codigo.md
          - Tipos de Datos:
              - Campos Comunes: semantica/data-retrieve/data/campos-comunes.md
              - Cita: semantica/data-retrieve/data/cita.md
              - Expediente: semantica/data-retrieve/data/expediente.md
              - Notificación: semantica/data-retrieve/data/notificacion.md
              - Pago: semantica/data-retrieve/data/pago.md
              - Persona: semantica/data-retrieve/data/persona.md
              - Registro Oficial: semantica/data-retrieve/data/registro-oficial.md
              - Servicio Administrativo: semantica/data-retrieve/data/servicio-administrativo.md
              - Unidad Orgánica: semantica/data-retrieve/data/unidad-organica.md
      - Metadata-Sync:
          - Visión General: semantica/metadata-sync/index.md
          - Endpoint: semantica/metadata-sync/endpoint-sync-metadata.md
          - Modelo SRMD Item: semantica/metadata-sync/modelo/sync-metadata-from-admin-to-core-item.md
          - Pop Message After Sync: semantica/metadata-sync/modelo/pop-message-after-sync-spec.md
      - Person-Sync:
          - Visión General: semantica/person-sync/index.md
          - Push: semantica/person-sync/push.md
          - Pull: semantica/person-sync/pull.md
          - Endpoint Push: semantica/person-sync/endpoints/push/endpoint-person-push-to-admin.md
          - Endpoint Pull (Create Job): semantica/person-sync/endpoints/pull/create-pull-from-admin-bespoke-job.md
          - Endpoint Pull (Get Job): semantica/person-sync/endpoints/pull/get-pull-from-admin-bespoke-job.md
          - Endpoint Pull (Fetch Bespoke): semantica/person-sync/endpoints/pull/fetch-persons-bespoke-export-asset.md
          - Endpoint Pull (Fetch Pregen): semantica/person-sync/endpoints/pull/fetch-persons-pregen-export-asset.md
          - Modelo Export Spec: semantica/person-sync/modelo/pull/export-spec.md
          - Modelo Person Hashes: semantica/person-sync/modelo/push/person-hashes.md
          - Documentación Arquitectura (ref.): semantica/person-sync/arquitectura-dena-completa.md
      - Semántica Base:
          - Visión General: semantica/semantica-base/index.md
          - HTTP Headers: semantica/semantica-base/http-headers.md
          - Consentimientos: semantica/semantica-base/consentimientos.md
          - Modelos:
              - DenaObjectRef: semantica/semantica-base/modelo/object-ref.md
              - Data Type Ref: semantica/semantica-base/modelo/data-type-ref.md
              - Language Texts: semantica/semantica-base/modelo/language-texts.md
              - Org Admin Ref: semantica/semantica-base/modelo/org-admin-ref.md
              - Person Ref: semantica/semantica-base/modelo/person-ref.md
              - DENAProtocol: semantica/semantica-base/modelo/protocol.md
              - DENAConsent: semantica/semantica-base/modelo/consent.md
              - Status (Respuesta): semantica/semantica-base/modelo/status.md
              - Tipos de Mensaje: semantica/semantica-base/modelo/message-types.md
              - UserAgent: semantica/semantica-base/modelo/user-agent.md
              - Tipos Sync: semantica/semantica-base/modelo/sync-types.md
      - Otra Documentación: semantica/otra-documentacion.md
  - Primeros Pasos:
      - Checklist de Onboarding: guia-inicio/onboarding.md
      - Instalación: guia-inicio/instalacion.md
      - Ejemplo End-to-End: guia-inicio/ejemplo-end-to-end.md
      - Pruebas de Conectividad: guia-inicio/probar-comunicaciones.md
      - Configuración Mock: guia-inicio/mock-expedientes.md
  - Herramientas:
      - DevTools Web: devtools/index.md
      - Ejemplos de Código: ejemplos-codigo/index.md
      - Recursos Postman: adjuntos/index.md
  - Ayuda y Referencia:
      - Preguntas Frecuentes: referencia/faq.md
      - Resolver Problemas: referencia/troubleshooting.md
      - Glosario de Términos: referencia/glosario.md
      - Límites y Restricciones API: referencia/limites-api.md
      - Contacto y Soporte: referencia/contacto.md
      - Changelog: referencia/changelog.md
      - Sistema de Versionado: referencia/sistema-versionado.md
      - Matriz de Compatibilidad: referencia/matriz-compatibilidad.md

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

